name: Lint and Test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: cashapp/activate-hermit@v1
        with:
          cache: "true"
      - name: Build
        run: go build ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          install-mode: "none"
      - name: Test
        run: go test -v ./...
