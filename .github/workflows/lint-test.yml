name: Lint and Test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cashapp/activate-hermit@v1
        with:
          cache: "true"
      - name: Build
        run: go build ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          install-mode: "none"
      - name: Test
        run: go test -v ./...
